name: Validation InfraReady

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_INVENTORY_ANY_UNPARSED_IS_FAILED: 'true'

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer Ansible Core 2.20.1
        run: python -m pip install ansible-core==2.20.1

      - name: Installer les collections Ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Valider l'inventaire Ansible
        run: ansible-inventory -i inventory/hosts.ini --graph

      - name: Verifier la syntaxe du playbook Nginx
        run: ansible-playbook -i inventory/hosts.ini --syntax-check playbooks/nginx.yml

      - name: Verifier la syntaxe du playbook Windows
        run: ansible-playbook -i inventory/hosts.ini --syntax-check playbooks/windows.yml

      - name: Verifier la syntaxe du playbook Maintenance
        run: ansible-playbook -i inventory/hosts.ini --syntax-check playbooks/maintenance.yml

      - name: Valider le YAML Prometheus
        run: python -c 'from pathlib import Path; import yaml; yaml.safe_load(Path("monitoring/prometheus.yml").read_text(encoding="utf-8"))'
